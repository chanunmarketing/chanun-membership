<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CHANUN Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .wrap { max-width: 640px; }
  .bar-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .bar-top img { height: 34px; }
  .who { font-size: 13px; color: var(--ink-2); text-align: right; }
  .login { max-width: 360px; margin: 10vh auto 0; }
  .login img { width: 92px; display: block; margin: 0 auto 18px; }
  .search { display: flex; gap: 8px; }
  .search .input { flex: 1; }
  .result { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--white); margin-top: 8px; }
  .result:hover { border-color: var(--blue); }
  .mhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .mname { font-size: 19px; font-weight: 500; line-height: 1.3; }
  .tier-chip { font-family: 'Jost'; letter-spacing: .18em; font-size: 12px; padding: 5px 12px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .kpi { background: var(--paper); border-radius: 10px; padding: 12px; }
  .kpi .v { font-family: 'Jost'; font-size: 26px; font-weight: 300; color: var(--blue); line-height: 1.1; }
  .kpi .v.disc { color: var(--turquoise); }
  .avail { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--white); margin: 20px 0 14px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px 0; font-size: 14px; color: var(--ink-2); }
  .seg button[aria-selected="true"] { background: var(--blue); color: #fff; }
  .preview { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .rw { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; }
  .rw + .rw { border-top: 1px solid var(--line); }
  .rw .n { flex: 1; min-width: 0; }
  .confirm { border: 1px solid var(--blue); border-radius: 12px; padding: 14px; margin-top: 10px; background: #F4F6FA; }
  .banner { background: var(--blue); color: #fff; border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
  .hist { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14px; }
  .hist + .hist { border-top: 1px solid var(--line); }
  .plus { color: var(--ok); } .minus { color: var(--err); }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .demo-flag { position: fixed; bottom: 12px; left: 12px; z-index: 60; }
  .pchips { margin: 2px 0 12px; }
  .pchip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; margin: 0 6px 6px 0; background: var(--white); cursor: pointer; }
  .pchip input { accent-color: var(--blue); margin: 0; }
  .pchip.on { border-color: var(--blue); background: #F4F6FA; }
  .pchip select { border: 0; background: transparent; font: inherit; color: var(--blue); padding: 0; }
  .plan { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--white); }
  .plan.off { opacity: .6; }
  .plan-h .pill { white-space: nowrap; }
  .plan-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .it { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .it:first-of-type { margin-top: 8px; }
  .act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .act .input { width: 86px; padding: 7px 10px; }
  .act .input.wide { width: 150px; }
  .plan-f { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .due-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px; }
  .due-row + .due-row { border-top: 1px solid var(--line); }
</style>
</head>
<body>
<!-- ============ Login ============ -->
<main id="v-login" class="wrap">
  <div class="login panel">
    <img src="logo_blue.png" alt="CHANUN">
    <div class="eyebrow en" style="text-align:center;margin-bottom:18px">Staff · Membership</div>
    <form id="login-form">
      <label class="field"><span>ชื่อพนักงาน (บันทึกในประวัติ)</span><input class="input" id="staff-name" maxlength="40" required></label>
      <label class="field"><span>PIN</span><input class="input" id="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
      <p id="login-err" class="small" style="color:var(--err);min-height:1em;margin:0 0 10px"></p>
      <button class="btn block" type="submit" id="login-btn">เข้าสู่ระบบ</button>
    </form>
  </div>
</main>

<!-- ============ Main ============ -->
<main id="v-main" class="wrap hidden">
  <div class="bar-top">
    <img src="logo_blue.png" alt="CHANUN">
    <div class="who"><div id="who"></div><button class="btn ghost sm" id="logout" style="margin-top:4px">ออกจากระบบ</button></div>
  </div>

  <form class="search" id="search-form">
    <input class="input" id="q" placeholder="รหัสสมาชิก / เบอร์ 4 ตัวท้าย / ชื่อ / HN" autocomplete="off">
    <button class="btn" type="submit">ค้นหา</button>
    <button class="btn ghost" type="button" id="scan-btn" aria-label="สแกน QR">สแกน</button>
  </form>
  <div id="reader" class="hidden"></div>
  <div id="results"></div>

  <section id="due" class="hidden" style="margin-top:20px">
    <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="eyebrow">ครบรอบดูแลภายใน 7 วัน</div><button class="btn ghost sm" type="button" id="due-refresh">รีเฟรช</button></div>
    <div class="panel" id="due-list" style="padding-top:4px;padding-bottom:4px"></div>
  </section>

  <section id="member" class="hidden" style="margin-top:20px">
    <div class="panel">
      <div class="mhead">
        <div>
          <div class="mname" id="m-name"></div>
          <div class="small muted"><span id="m-code"></span> · <span id="m-phone"></span> · HN <span id="m-hn"></span></div>
        </div>
        <span class="tier-chip" id="m-tier"></span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="xs muted">ราคาสมาชิก เครื่อง / ยาฉีด</div><div class="v disc" id="m-disc"></div></div>
        <div class="kpi"><div class="xs muted">ดาวคงเหลือ</div><div class="v num" id="m-bal"></div></div>
        <div class="kpi"><div class="xs muted">ยอด 12 เดือน</div><div class="v num" id="m-roll" style="font-size:20px"></div></div>
      </div>
      <div class="avail" id="m-avail"></div>
      <div class="xs muted" style="margin-top:10px" id="m-next"></div>
      <div class="xs" style="margin-top:6px;color:var(--warn)" id="m-note"></div>
    </div>
    <div id="banner"></div>

    <div class="seg" role="tablist">
      <button data-p="buy" aria-selected="true">บันทึกยอดซื้อ</button>
      <button data-p="care" aria-selected="false" id="seg-care" class="hidden">โปรแกรม</button>
      <button data-p="redeem" aria-selected="false">แลกรางวัล</button>
      <button data-p="adjust" aria-selected="false">ปรับดาว</button>
    </div>

    <form id="p-buy" class="panel">
      <label class="field"><span>ยอดชำระจริงหลังส่วนลด (บาท) — คืนเงินใส่ติดลบ</span><input class="input num" id="amount" inputmode="decimal" autocomplete="off" required></label>
      <label class="field"><span>เลขใบเสร็จ (จาก APSX เช่น RE202611190001)</span><input class="input" id="receipt" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="40" style="text-transform:uppercase"></label>
      <label class="field"><span>หมายเหตุ <span class="muted">(ห้ามใส่ชื่อหัตถการ/อาการ)</span></span><input class="input" id="note" maxlength="120"></label>
      <div id="buy-progs" class="hidden"><label class="field" style="margin-bottom:6px"><span>โปรแกรมดูแลในบิลนี้ (ตั้งเตือนอัตโนมัติ)</span><select class="input" id="buy-prog-add"></select></label><div class="pchips" id="buy-chips"></div></div>
      <div class="preview hidden" id="buy-preview"></div>
      <div id="buy-warn"></div>
      <button class="btn block" type="submit" id="buy-btn">บันทึก</button>
    </form>

    <div id="p-care" class="panel hidden">
      <div id="care-consent"></div>
      <div id="care-list"></div>
      <div class="plan" style="background:var(--paper);border-style:dashed">
        <div style="font-weight:500;margin-bottom:8px">ลงโปรแกรม (ไม่มียอดชำระในวันนี้)</div>
        <div class="act">
          <select class="input wide" id="ca-prog"></select>
          <select class="input hidden" id="ca-int"></select>
          <input class="input wide" id="ca-receipt" placeholder="เลขใบเสร็จ (ถ้ามี)" autocomplete="off" style="text-transform:uppercase">
          <button class="btn sm" type="button" id="ca-btn">ลงโปรแกรม</button>
        </div>
        <div class="xs muted" style="margin-top:6px">ซื้อพร้อมบิล ให้ติ๊กในแท็บ บันทึกยอดซื้อ แทน (ได้ดาวและตั้งเตือนในครั้งเดียว)</div>
      </div>
    </div>

    <div id="p-redeem" class="panel hidden">
      <div id="rw-list"></div>
      <div id="rw-confirm"></div>
    </div>

    <form id="p-adjust" class="panel hidden">
      <p class="small muted" style="margin-top:0">ใช้เฉพาะกรณีพิเศษ เช่น ยกยอดจากระบบเดิม หรือชดเชย — ดาวพิเศษไม่นับเข้าระดับ</p>
      <label class="field"><span>จำนวนดาว (ติดลบได้)</span><input class="input num" id="adj-stars" inputmode="numeric" required></label>
      <label class="field"><span>เหตุผล</span><input class="input" id="adj-note" required maxlength="120"></label>
      <button class="btn block" type="submit" id="adj-btn">บันทึกการปรับดาว</button>
    </form>

    <div class="section"><div class="eyebrow" style="margin-bottom:8px">ประวัติ</div><div class="panel" id="m-hist" style="padding-top:6px;padding-bottom:6px"></div></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="demo.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.CHANUN_CONFIG || {}, DEMO = !!window.CHANUN_DEMO;
  var PIN = null, STAFF = '', cur = null, scanner = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Math.round(Number(n) || 0).toLocaleString('th-TH'); }
  function d(ymd) { if (!ymd) return ''; var p = ymd.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 5)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'Asia/Bangkok' }); }
  function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast'; }, 3500); }
  function isLight(hex) { var h = String(hex || '').replace('#', ''); if (h.length !== 6) return false; return (0.299 * parseInt(h.substr(0, 2), 16) + 0.587 * parseInt(h.substr(2, 2), 16) + 0.114 * parseInt(h.substr(4, 2), 16)) > 170; }
  function busy(btn, on, label) { btn.disabled = on; if (on) { btn.dataset.l = btn.textContent; btn.textContent = 'กำลังบันทึก…'; } else btn.textContent = label || btn.dataset.l; }

  function api(body) {
    body.pin = PIN; body.staff = STAFF;
    if (DEMO) return window.CHANUN_DEMO_API(body);
    if (!CFG.API_URL || /ใส่/.test(CFG.API_URL)) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ใน config.js'));
    return fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.message); e.code = j.error; throw e; } return j.data; });
  }
  function onErr(e) {
    toast(e.message || 'เกิดข้อผิดพลาด', true);
    if (e.code === 'BAD_PIN' || e.code === 'LOCKED') logout();
  }

  if (DEMO) { document.body.insertAdjacentHTML('beforeend', '<span class="pill warn demo-flag">โหมดทดลอง · PIN 123456</span>'); }
  try { $('staff-name').value = localStorage.getItem('chanun_staff') || ''; } catch (x) {}

  /* ---------- login ---------- */
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    STAFF = $('staff-name').value.trim(); PIN = $('pin').value.trim();
    if (!STAFF) { $('login-err').textContent = 'กรุณาใส่ชื่อพนักงาน'; return; }
    var b = $('login-btn'); b.disabled = true;
    api({ action: 'staff.login' }).then(function () {
      try { localStorage.setItem('chanun_staff', STAFF); } catch (x) {}
      $('pin').value = ''; $('login-err').textContent = '';
      $('who').textContent = STAFF;
      $('v-login').classList.add('hidden'); $('v-main').classList.remove('hidden');
      $('q').focus();
      loadDue();
    }).catch(function (e) { $('login-err').textContent = e.message; PIN = null; }).then(function () { b.disabled = false; });
  });
  function logout() { PIN = null; cur = null; stopScan(); $('member').classList.add('hidden'); $('due').classList.add('hidden'); $('results').innerHTML = ''; $('v-main').classList.add('hidden'); $('v-login').classList.remove('hidden'); }
  $('logout').addEventListener('click', logout);

  /* ---------- search & scan ---------- */
  $('search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q').value.trim(); if (!q) return;
    var code = parseCode(q);
    if (code) return openMember(code);
    api({ action: 'staff.find', query: q }).then(function (r) {
      if (r.results.length === 1) return openMember(r.results[0].code);
      $('results').innerHTML = r.results.length ? r.results.map(function (m) {
        return '<button class="result" data-code="' + esc(m.code) + '"><span><b>' + esc(m.name) + '</b>' + (m.nickname ? ' (' + esc(m.nickname) + ')' : '') + '<br><span class="xs muted">' + esc(m.code) + ' · xxx-' + esc(m.phoneLast4) + '</span></span><span class="xs muted">' + esc(m.status) + '</span></button>';
      }).join('') : '<p class="small muted">ไม่พบสมาชิก</p>';
    }).catch(onErr);
  });
  $('results').addEventListener('click', function (e) { var b = e.target.closest('.result'); if (b) openMember(b.dataset.code); });
  function parseCode(s) { var m = String(s).toUpperCase().match(/(?:CHANUN-MEMBER:)?([A-Z]{1,4}\d{3,})$/); return m && /^[A-Z]{1,4}\d{3,}$/.test(m[1]) && !/^HN/.test(m[1]) ? m[1] : null; }

  $('scan-btn').addEventListener('click', function () {
    if (scanner) return stopScan();
    var go = function () {
      $('reader').classList.remove('hidden');
      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 230 }, function (text) {
        var code = parseCode(text); if (!code) return;
        stopScan(); openMember(code);
      }).catch(function (err) { toast('เปิดกล้องไม่ได้: ' + err, true); stopScan(); });
    };
    if (window.Html5Qrcode) return go();
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = go; s.onerror = function () { toast('โหลดตัวสแกนไม่สำเร็จ — พิมพ์รหัสแทน', true); };
    document.head.appendChild(s);
  });
  function stopScan() { if (scanner) { var s = scanner; scanner = null; s.stop().catch(function () {}).then(function () { try { s.clear(); } catch (x) {} }); } $('reader').classList.add('hidden'); }

  /* ---------- member ---------- */
  function openMember(code) {
    $('results').innerHTML = '';
    api({ action: 'staff.member', code: code }).then(function (r) { $('banner').innerHTML = ''; clearWarn(); render(r.view); }).catch(onErr);
  }

  function render(v) {
    cur = v;
    var t = v.tier;
    $('member').classList.remove('hidden');
    $('m-name').textContent = v.member.name + (v.member.nickname ? ' (' + v.member.nickname + ')' : '');
    $('m-code').textContent = v.member.code;
    $('m-phone').textContent = v.member.phone || '-';
    $('m-hn').textContent = v.member.hn || '-';
    var chip = $('m-tier'); chip.textContent = t.name + (v.overridden ? ' *' : '');
    chip.style.background = t.color || '#182E56'; chip.style.color = isLight(t.color) ? '#161616' : '#fff';
    chip.style.border = isLight(t.color) ? '1px solid #D9D3C9' : '0';
    $('m-disc').textContent = Math.round((t.discount || 0) * 100) + '%' + (t.discount2 ? ' / ' + Math.round(t.discount2 * 100) + '%' : '');
    $('m-bal').textContent = fmt(v.stars.balance);
    $('m-roll').textContent = fmt(v.rolling.baht);
    var av = [];
    (v.welcome || []).forEach(function (w) { av.push('<span class="pill ' + (w.locked ? 'warn' : 'ok') + '">Welcome ' + esc(w.tierName) + ': ' + esc(w.gift) + (w.locked ? ' (' + esc(w.lockReason) + ')' : '') + '</span>'); });
    if (v.birthday && v.birthday.available) av.push('<span class="pill ok">เดือนเกิด: ' + esc(v.birthday.gift) + '</span>');
    (v.annual || []).forEach(function (a) { if (a.available) av.push('<span class="pill ok">ประจำปี: ' + esc(a.gift) + '</span>'); });
    if (v.promoPass && v.promoPass.available) av.push('<span class="pill ok">Promo Pass เหลือ ' + v.promoPass.remaining + ' ครั้ง</span>');
    if (v.stars.expiring) av.push('<span class="pill warn">' + v.stars.expiring.stars + ' ดาวหมดอายุหลัง ' + esc(d(v.stars.expiring.lastDay)) + '</span>');
    if (v.member.status === 'ระงับ') av.push('<span class="pill warn">บัญชีถูกระงับ</span>');
    $('m-avail').innerHTML = av.join('');
    $('m-next').textContent = v.next ? ('อีก ' + v.next.starsNeeded + ' ดาว (' + fmt(v.next.bahtNeeded) + ' บาท) ถึง ' + v.next.name + (v.tierUntil ? ' · ประเมินระดับใหม่ ' + d(v.tierUntil) : '')) : 'ระดับสูงสุด';
    $('m-note').textContent = v.member.note || '';
    renderRewards();
    renderCare();
    $('m-hist').innerHTML = v.history.length ? v.history.map(function (h) {
      return '<div class="hist"><span><span class="xs muted">' + esc(d(h.date)) + '</span> ' + esc(h.label) + (h.amount ? ' · <span class="num">' + fmt(h.amount) + '</span>' : '') + (h.receipt ? ' <span class="xs muted">' + esc(h.receipt) + '</span>' : '') + '</span>' +
        (h.stars ? '<span class="num ' + (h.stars > 0 ? 'plus' : 'minus') + '">' + (h.stars > 0 ? '+' : '') + h.stars + '</span>' : '') + '</div>';
    }).join('') : '<p class="small muted">ยังไม่มีรายการ</p>';
    updatePreview();
  }

  function renderRewards() {
    var v = cur, items = [];
    (v.welcome || []).forEach(function (w) { items.push({ code: w.code, name: 'Welcome ' + w.tierName + ': ' + w.gift + (w.cond ? ' — ' + w.cond : ''), stars: 0, ok: !w.locked, why: w.lockReason }); });
    if (v.birthday && v.birthday.available) items.push({ code: 'BIRTHDAY', name: 'ของขวัญเดือนเกิด: ' + v.birthday.gift + (v.birthday.cond ? ' — ' + v.birthday.cond : ''), stars: 0, ok: true });
    (v.annual || []).forEach(function (a) { if (a.available) items.push({ code: a.code, name: 'สิทธิ์ประจำปี: ' + a.gift, stars: 0, ok: true }); });
    if (v.promoPass) items.push({ code: 'PROMOPASS', name: 'Promo Pass: ราคาโปรที่จบไม่เกิน 60 วัน (เหลือ ' + v.promoPass.remaining + '/' + v.promoPass.quota + ')', stars: 0, ok: v.promoPass.available, why: 'ใช้ครบแล้วปีนี้' });
    v.rewards.forEach(function (r) { items.push({ code: r.code, name: r.name, stars: r.stars, ok: r.canRedeem, why: !r.tierOk ? 'สำหรับ ' + r.minTier + '+' : 'ดาวไม่พอ' }); });
    $('rw-list').innerHTML = items.map(function (it) {
      return '<div class="rw"><div class="n"><div>' + esc(it.name) + '</div><div class="xs muted">' + esc(it.code) + (it.stars ? ' · ' + it.stars + ' ดาว' : ' · ไม่ใช้ดาว') + '</div></div>' +
        (it.ok ? '<button class="btn sm" data-r="' + esc(it.code) + '" data-n="' + esc(it.name) + '" data-s="' + it.stars + '">แลก</button>' : '<span class="xs muted">' + esc(it.why) + '</span>') + '</div>';
    }).join('');
    $('rw-confirm').innerHTML = '';
  }
  $('rw-list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-r]'); if (!b) return;
    var s = +b.dataset.s;
    $('rw-confirm').innerHTML = '<div class="confirm"><div style="font-weight:500">ยืนยันการแลก</div><div class="small" style="margin:4px 0 12px">' + esc(b.dataset.n) +
      (s ? '<br>ใช้ ' + s + ' ดาว · คงเหลือ ' + (cur.stars.balance - s) + ' ดาว' : '') + '</div><div class="row"><button class="btn ghost" data-x="no">ยกเลิก</button><button class="btn" data-x="yes" data-r="' + esc(b.dataset.r) + '">ยืนยัน</button></div></div>';
    $('rw-confirm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('rw-confirm').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-x]'); if (!b) return;
    if (b.dataset.x === 'no') { $('rw-confirm').innerHTML = ''; return; }
    busy(b, true);
    api({ action: 'staff.redeem', code: cur.member.code, rewardCode: b.dataset.r }).then(function (r) {
      render(r.view); toast('บันทึกการแลกเรียบร้อย');
    }).catch(function (err) { busy(b, false); onErr(err); });
  });

  /* ---------- purchase ---------- */
  function updatePreview() {
    var p = $('buy-preview'); if (!cur) return;
    var amt = Number(String($('amount').value).replace(/,/g, ''));
    if (!amt) { p.classList.add('hidden'); return; }
    var B = cur.bahtPerStar, rem = (B - cur.stars.toNextStarBaht) % B;
    var gain = Math.floor((rem + amt) / B);
    p.classList.remove('hidden');
    p.innerHTML = amt > 0 ? 'จะได้ <b>' + gain + ' ดาว</b> · หลังบันทึกเหลืออีก ' + fmt(B - ((rem + amt) % B)) + ' บาทถึงดาวถัดไป'
      : 'คืนเงิน: หักดาว ' + Math.abs(gain) + ' ดาว';
  }
  function normReceipt(s) { return String(s || '').toUpperCase().replace(/\s+/g, ''); }
  function clearWarn() { $('buy-warn').innerHTML = ''; $('buy-btn').classList.remove('hidden'); }
  $('amount').addEventListener('input', function () { updatePreview(); clearWarn(); });
  $('receipt').addEventListener('input', clearWarn);
  $('receipt').addEventListener('blur', function () { $('receipt').value = normReceipt($('receipt').value); });
  function submitPurchase(confirmDup) {
    if (!cur) return;
    var btn = confirmDup ? $('buy-warn').querySelector('[data-x="yes"]') : $('buy-btn');
    busy(btn, true);
    var body = { action: 'staff.purchase', code: cur.member.code, amount: $('amount').value, receipt: normReceipt($('receipt').value), note: $('note').value.trim() };
    var progs = pickedPrograms();
    if (progs.length) body.programs = progs;
    if (confirmDup) body.confirmDup = true;
    api(body).then(function (r) {
      $('amount').value = ''; $('receipt').value = ''; $('note').value = ''; clearWarn();
      render(r.view);
      var gained = r.view.stars.balance - r.starsBefore;
      toast('บันทึกแล้ว ' + (gained >= 0 ? '+' : '') + gained + ' ดาว' + (progs.length ? ' · ตั้งเตือน ' + progs.length + ' โปรแกรม' : ''));
      if (r.tierUp) $('banner').innerHTML = '<div class="banner"><div class="eyebrow" style="color:#fff;opacity:.8">Tier up</div><div style="font-size:17px;margin-top:4px">เลื่อนเป็น <b>' + esc(r.view.tier.name) + '</b> แล้ว — แจ้งสมาชิกและมอบ Welcome: ' + esc(r.view.tier.welcome) + '</div></div>';
    }).catch(function (err) {
      if (err.code === 'CONFIRM_DUPLICATE' && !confirmDup) {
        $('buy-warn').innerHTML = '<div class="confirm" style="margin:0 0 12px"><div style="font-weight:500">อาจเป็นบิลซ้ำ</div><div class="small" style="margin:4px 0 12px">' + esc(err.message) +
          '</div><div class="row"><button class="btn ghost" type="button" data-x="no">ยกเลิก</button><button class="btn" type="button" data-x="yes">ยืนยันบิลใหม่</button></div></div>';
        $('buy-btn').classList.add('hidden');
        $('buy-warn').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      onErr(err);
    }).then(function () { if (btn && document.body.contains(btn)) busy(btn, false, confirmDup ? 'ยืนยันบิลใหม่' : 'บันทึก'); });
  }
  $('p-buy').addEventListener('submit', function (e) { e.preventDefault(); submitPurchase(false); });
  $('buy-warn').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-x]'); if (!b) return;
    if (b.dataset.x === 'no') { clearWarn(); return; }
    submitPurchase(true);
  });

  /* ---------- adjust ---------- */
  $('p-adjust').addEventListener('submit', function (e) {
    e.preventDefault(); if (!cur) return;
    var btn = $('adj-btn'); busy(btn, true);
    api({ action: 'staff.adjust', code: cur.member.code, stars: $('adj-stars').value, note: $('adj-note').value.trim() }).then(function (r) {
      $('adj-stars').value = ''; $('adj-note').value = ''; render(r.view); toast('ปรับดาวเรียบร้อย');
    }).catch(onErr).then(function () { busy(btn, false, 'บันทึกการปรับดาว'); });
  });

  /* ---------- care programs ---------- */
  function intLabel(n) { return n % 7 === 0 ? 'ทุก ' + (n / 7) + ' สัปดาห์' : 'ทุก ' + n + ' วัน'; }
  function intOptions(list, sel) { return list.map(function (n) { return '<option value="' + n + '"' + (n === sel ? ' selected' : '') + '>' + intLabel(n) + '</option>'; }).join(''); }
  function progOptions(list, first) {
    var one = list.filter(function (p) { return !p.isPackage; }), pkg = list.filter(function (p) { return p.isPackage; });
    var opt = function (p) { return '<option value="' + esc(p.code) + '">' + esc(p.name) + '</option>'; };
    return '<option value="">' + first + '</option>' + (one.length ? '<optgroup label="ทำครั้งนี้ (เตือนตามรอบ)">' + one.map(opt).join('') + '</optgroup>' : '') +
      (pkg.length ? '<optgroup label="คอร์ส / แพ็กเกจ (นับครั้ง หมดอายุ)">' + pkg.map(opt).join('') + '</optgroup>' : '');
  }
  function renderBuyProgs() {
    var c = cur && cur.care;
    $('buy-progs').classList.toggle('hidden', !(c && c.programs && c.programs.length));
    $('buy-chips').innerHTML = '';
    if (!c || !c.programs) return;
    $('buy-prog-add').innerHTML = progOptions(c.programs, '+ เพิ่มโปรแกรม (ถ้ามี)');
  }
  $('buy-prog-add').addEventListener('change', function () {
    var p = progBy(this.value); this.value = ''; if (!p) return;
    if ($('buy-chips').querySelector('[data-code="' + CSS.escape(p.code) + '"]')) return;
    $('buy-chips').insertAdjacentHTML('beforeend', '<label class="pchip on" data-code="' + esc(p.code) + '"><input type="checkbox" checked value="' + esc(p.code) + '"> ' + esc(p.name) +
      (p.intervals.length ? ' <select aria-label="รอบ">' + intOptions(p.intervals, p.intervals[0]) + '</select>' : '') + '</label>');
  });
  $('buy-chips').addEventListener('change', function (e) {
    var chip = e.target.closest('.pchip'); if (!chip || e.target.type !== 'checkbox') return;
    if (!e.target.checked) chip.remove();
  });
  function pickedPrograms() {
    return Array.prototype.map.call($('buy-chips').querySelectorAll('input:checked'), function (i) {
      var sel = i.parentNode.querySelector('select');
      return sel ? { program: i.value, interval: +sel.value } : { program: i.value };
    });
  }
  function itemLine(it, plan) {
    var a = [];
    if (it.quota !== null && it.quota !== undefined) a.push('เหลือ <b class="num">' + fmt(it.remaining) + '</b>/' + fmt(it.quota) + ' ' + esc(it.unit));
    else if (it.unlimited) a.push('ไม่จำกัด · มาแล้ว ' + it.visits + ' ครั้ง');
    else a.push('มาแล้ว ' + it.visits + ' ครั้ง');
    if (it.last) a.push('ล่าสุด ' + d(it.last));
    if (it.nextDue && plan.active) a.push('ถึงรอบ ' + d(it.nextDue));
    return a.join(' · ');
  }
  function renderCare() {
    var c = cur && cur.care;
    $('seg-care').classList.toggle('hidden', !c);
    renderBuyProgs();
    if (!c) { if (!$('p-care').classList.contains('hidden')) document.querySelector('.seg button[data-p="buy"]').click(); return; }
    $('care-consent').innerHTML = c.consent ? '' : '<p class="xs" style="color:var(--warn);margin:0 0 10px">สมาชิกยังไม่ได้กดรับทราบข้อตกลงใหม่ในบัตร — ข้อความดูแลยังส่งได้ แต่บัตรยังไม่แสดงโปรแกรม</p>';
    $('care-list').innerHTML = c.plans.length ? c.plans.map(function (p) {
      var head = '<div class="plan-h"><div><div style="font-weight:500">' + esc(p.name) + '</div><div class="xs muted">' + esc(p.id) + ' · เริ่ม ' + d(p.start) +
        (p.exp ? ' · หมดอายุ ' + d(p.exp) : '') + (p.receipt ? ' · ' + esc(p.receipt) : '') + (p.interval ? ' · ' + intLabel(p.interval) : '') + '</div></div>' +
        '<span class="pill ' + (p.active ? 'ok' : 'warn') + '">' + esc(p.status) + '</span></div>';
      var items = p.items.map(function (it) {
        var useQty = it.unit === 'ครั้ง' ? '1' : '';
        return '<div class="it"><div class="small"><div>' + esc(it.name) + '</div><div class="xs muted">' + itemLine(it, p) + '</div></div>' +
          (p.active ? '<div class="act"><input class="input num" inputmode="numeric" value="' + useQty + '" placeholder="' + esc(it.unit) + '" data-qty="' + esc(it.name) + '">' +
            '<button class="btn sm" type="button" data-act="use" data-plan="' + esc(p.id) + '" data-item="' + esc(it.name) + '">ใช้วันนี้</button>' +
            (it.quota !== null && it.quota !== undefined ? '<button class="btn ghost sm" type="button" data-act="adj-open" data-plan="' + esc(p.id) + '" data-item="' + esc(it.name) + '">ปรับจำนวน</button>' : '') + '</div>' : '') +
          (p.active && it.quota !== null && it.quota !== undefined ? '<div class="act hidden" data-adj="' + esc(p.id + '|' + it.name) + '" style="width:100%"><input class="input num" inputmode="numeric" placeholder="+100 / -10"><input class="input wide" placeholder="เหตุผล เช่น แถมเพิ่ม" maxlength="120">' +
          '<button class="btn sm" type="button" data-act="adj" data-plan="' + esc(p.id) + '" data-item="' + esc(it.name) + '">บันทึก</button></div>' : '') + '</div>';
      }).join('');
      var foot = p.active ? '<div class="plan-f">' +
        (p.booked ? '<span class="pill ok">นัดแล้ว ' + d(p.booked) + '</span><button class="btn ghost sm" type="button" data-act="unbook" data-plan="' + esc(p.id) + '">ล้างนัด</button>'
          : '<input class="input" type="date" data-book="' + esc(p.id) + '" style="width:150px"><button class="btn ghost sm" type="button" data-act="book" data-plan="' + esc(p.id) + '">นัดแล้ว (หยุดเตือน)</button>') +
        (p.intervals && p.intervals.length && p.isPackage ? '<select class="input" data-int="' + esc(p.id) + '" style="width:130px">' + intOptions(p.intervals, p.interval) + '</select>' : '') +
        '<button class="btn ghost sm" type="button" data-act="cancel" data-plan="' + esc(p.id) + '" style="margin-left:auto">ยกเลิกแผน</button></div>' : '';
      return '<div class="plan' + (p.active ? '' : ' off') + '">' + head + items + foot + '</div>';
    }).join('') : '<p class="small muted" style="margin-top:0">ยังไม่มีโปรแกรมดูแล</p>';
    var cp = $('ca-prog'), prev = cp.value;
    cp.innerHTML = progOptions(c.programs, 'เลือกโปรแกรม');
    cp.value = prev && c.programs.some(function (p) { return p.code === prev; }) ? prev : '';
    syncAddInterval();
  }
  function progBy(code) { return ((cur && cur.care && cur.care.programs) || []).filter(function (p) { return p.code === code; })[0]; }
  function syncAddInterval() {
    var p = progBy($('ca-prog').value), s = $('ca-int');
    s.classList.toggle('hidden', !(p && p.intervals.length));
    s.innerHTML = p && p.intervals.length ? intOptions(p.intervals, p.intervals[0]) : '';
  }
  $('ca-prog').addEventListener('change', syncAddInterval);
  function careCall(body, btn, okMsg) {
    body.code = cur.member.code;
    var isBtn = btn && btn.tagName === 'BUTTON';
    if (isBtn) busy(btn, true); else if (btn) btn.disabled = true;
    return api(body).then(function (r) { render(r.view); toast(okMsg); }).catch(function (e) { if (isBtn) busy(btn, false); else if (btn) btn.disabled = false; onErr(e); });
  }
  $('ca-btn').addEventListener('click', function () {
    var p = $('ca-prog').value; if (!p) return toast('กรุณาเลือกโปรแกรม', true);
    var body = { action: 'staff.careEnroll', program: p, receipt: normReceipt($('ca-receipt').value) };
    if (!$('ca-int').classList.contains('hidden')) body.interval = +$('ca-int').value;
    careCall(body, this, 'ลงโปรแกรมแล้ว').then(function () { $('ca-receipt').value = ''; busy($('ca-btn'), false, 'ลงโปรแกรม'); });
  });
  $('care-list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var plan = b.dataset.plan, item = b.dataset.item, act = b.dataset.act, box = b.closest('.plan');
    if (act === 'use') {
      var q = box.querySelector('input[data-qty="' + CSS.escape(item) + '"]').value;
      if (!(+q > 0)) return toast('กรุณาใส่จำนวนที่ใช้', true);
      careCall({ action: 'staff.careUse', plan: plan, item: item, qty: +q }, b, 'บันทึกการใช้ ' + item + ' ' + q + ' แล้ว');
    } else if (act === 'adj-open') {
      box.querySelector('[data-adj="' + CSS.escape(plan + '|' + item) + '"]').classList.toggle('hidden');
    } else if (act === 'adj') {
      var row = b.parentNode, ins = row.querySelectorAll('input');
      careCall({ action: 'staff.careAdjust', plan: plan, item: item, qty: +ins[0].value, note: ins[1].value.trim() }, b, 'ปรับจำนวนแล้ว');
    } else if (act === 'book') {
      var dt = box.querySelector('input[data-book]').value;
      if (!dt) return toast('เลือกวันนัดก่อน', true);
      careCall({ action: 'staff.carePlan', plan: plan, op: 'booked', date: dt }, b, 'บันทึกวันนัดแล้ว — หยุดเตือนจนถึงวันนัด');
    } else if (act === 'unbook') {
      careCall({ action: 'staff.carePlan', plan: plan, op: 'clearBooked' }, b, 'ล้างนัดแล้ว');
    } else if (act === 'cancel') {
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'กดอีกครั้งเพื่อยืนยันยกเลิก'; b.classList.remove('ghost'); return; }
      careCall({ action: 'staff.carePlan', plan: plan, op: 'cancel' }, b, 'ยกเลิกแผนแล้ว');
    }
  });
  $('care-list').addEventListener('change', function (e) {
    var s = e.target.closest('select[data-int]'); if (!s) return;
    careCall({ action: 'staff.carePlan', plan: s.dataset.int, op: 'interval', interval: +s.value }, s, 'เปลี่ยนรอบเป็น ' + intLabel(+s.value) + ' แล้ว');
  });
  function loadDue() {
    api({ action: 'staff.careDue', days: 7 }).then(function (r) {
      if (!r.installed) { $('due').classList.add('hidden'); return; }
      $('due').classList.remove('hidden');
      $('due-list').innerHTML = r.list.length ? r.list.map(function (x) {
        return '<div class="due-row"><span><b>' + esc(x.name) + '</b> <span class="xs muted">' + esc(x.code) + ' · xxx-' + esc(x.phoneLast4) + '</span><br>' +
          '<span class="xs">' + esc(x.program) + (x.item && x.item !== x.program ? ' · ' + esc(x.item) : '') + ' · ' + (x.overdue ? '<span style="color:var(--err)">เลยรอบ ' + d(x.due) + '</span>' : 'ถึงรอบ ' + d(x.due)) +
          (x.booked ? ' · <span style="color:var(--ok)">นัดแล้ว ' + d(x.booked) + '</span>' : '') + '</span></span>' +
          '<button class="btn ghost sm" type="button" data-code="' + esc(x.code) + '">เปิด</button></div>';
      }).join('') : '<p class="small muted">ไม่มีคนไข้ครบรอบในสัปดาห์นี้</p>';
    }).catch(function () { $('due').classList.add('hidden'); });
  }
  $('due-refresh').addEventListener('click', loadDue);
  $('due-list').addEventListener('click', function (e) { var b = e.target.closest('button[data-code]'); if (b) { openMember(b.dataset.code); $('member').scrollIntoView({ behavior: 'smooth' }); } });

  /* ---------- tabs ---------- */
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
      ['buy', 'care', 'redeem', 'adjust'].forEach(function (k) { $('p-' + k).classList.toggle('hidden', k !== b.dataset.p); });
    });
  });
})();
</script>
</body>
</html>
